name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test
        run: python -m pytest tests -q
      - name: Smoke-run the bundled examples
        run: |
          python -m backtest_lint --bundle examples/good
          python -m backtest_lint --bundle examples/bad || true
      - name: Run the reproducible demo
        run: python demo/run_demo.py

  windows:
    # 控制台编码不是 UTF-8，报告里的 ✅/⚠️/❌ 必须还能打出来
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test
        run: python -m pytest tests -q
      - name: Smoke-run on the default console encoding
        run: |
          python -m backtest_lint --bundle examples/good
          python -m backtest_lint --bundle examples/bad
        continue-on-error: true
