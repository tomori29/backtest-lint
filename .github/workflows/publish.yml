name: publish

# 打 tag 发 Release 时自动构建并上传到 PyPI（Trusted Publishing，无需在仓库里存 token）。
# 首次使用前需要在 PyPI 项目设置里登记本仓库为 trusted publisher：
#   https://pypi.org/manage/account/publishing/
#   owner=tomori29  repo=backtest-lint  workflow=publish.yml  environment=pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
